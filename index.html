<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lanciers — Planning partagé</title>
<link rel="icon" type="image/png" href="https://media.discordapp.net/attachments/1379385028919820359/1417888895210618921/f423369b-b7f6-438e-8fe4-307099f07ca0.png?ex=6ab341af&is=6ab1f02f&hm=725b5fb50f9f280900f010a527575d0f8bc8791de63fd2ff477aedf79e45783c&=&format=webp&quality=lossless">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0f1115;--panel:#181b22;--panel2:#20242d;--line:#343a46;--text:#f1f3f5;--muted:#9da5b1;--accent:#d66b32;--accent2:#ef9b5c;--danger:#d95d5d}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1250px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border:2px solid var(--accent);border-radius:12px;overflow:hidden;background:#12151a;display:flex;align-items:center;justify-content:center;flex:none}.logo img{width:100%;height:100%;object-fit:contain}
h1{font-size:22px;margin:0}.subtitle{font-size:13px;color:var(--muted);margin-top:3px}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:9px;cursor:pointer}.btn:hover{border-color:#596170}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:#ffb0b0}
.dates{display:flex;gap:8px;overflow:auto;padding-bottom:10px;margin-bottom:8px}.date-tab{white-space:nowrap;padding:10px 16px;border:1px solid var(--line);background:var(--panel);border-radius:9px;color:var(--muted);cursor:pointer}.date-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.note-row{display:flex;align-items:center;gap:12px;margin:0 0 14px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 14px}
.note-row label{color:var(--muted);font-size:12px;white-space:nowrap;margin:0}
.note-row input{background:transparent;border:none;border-radius:0;padding:8px 0;font-size:14px;color:var(--text)}
.note-row input:focus{outline:none}
.note-row input:disabled{color:var(--muted);cursor:not-allowed}
.note-status{font-size:11px;color:var(--muted);min-width:80px;text-align:right;white-space:nowrap}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 18px}.summary{color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.table-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.card-head{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;background:var(--panel2);border-bottom:1px solid var(--line)}.table-name{font-size:17px;font-weight:800}.status{font-size:11px;padding:5px 8px;border-radius:20px;background:#29302a;color:#8fe0ae}
.card-body{padding:14px}.row{display:flex;gap:10px;margin:9px 0}.label{width:78px;color:var(--muted);font-size:12px;padding-top:3px}.value{font-weight:600;word-break:break-word}.players{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.player{background:#12151a;border:1px solid var(--line);padding:9px;border-radius:8px}.player small{display:block;color:var(--muted);font-size:10px;margin-bottom:2px}.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1;padding:8px}
.empty{padding:40px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.loading{text-align:center;padding:40px;color:var(--muted)}
.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}.modal-wrap.open{display:flex}.modal{width:min(620px,100%);background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:20px;box-shadow:0 20px 60px #0008}.modal h2{margin:0 0 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field.full{grid-column:1/-1}label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}input,select{width:100%;background:#11141a;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.notice{margin-bottom:14px;padding:10px 12px;border:1px solid #60452f;background:#241b15;color:#e9b58f;border-radius:9px;font-size:13px;display:none}.notice.show{display:block}
.name-preview{padding:10px;background:#11141a;border:1px solid var(--line);border-radius:8px;font-weight:700;color:var(--accent2)}
@media(max-width:650px){.app{padding:12px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}header{align-items:flex-start}.toolbar{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}.note-row{flex-direction:column;align-items:stretch;gap:4px}.note-status{text-align:left}}
</style>
</head>
<body>
<div class="app">
<header>
<div class="brand"><div class="logo"><img src="https://media.discordapp.net/attachments/1379385028919820359/1417888895210618921/f423369b-b7f6-438e-8fe4-307099f07ca0.png?ex=6ab341af&is=6ab1f02f&hm=725b5fb50f9f280900f010a527575d0f8bc8791de63fd2ff477aedf79e45783c&=&format=webp&quality=lossless" alt="Logo"></div><div><h1>Organisation des parties</h1><div class="subtitle">Planning Warhammer partagé — les 10 prochains samedis</div></div></div>
</header>
<div id="notice" class="notice"></div>
<div class="dates" id="dates"></div>

<div class="note-row">
<label for="dateNote">Commentaire :</label>
<input id="dateNote" type="text" maxlength="200" placeholder="" disabled>
<span class="note-status" id="noteStatus"></span>
</div>

<div class="toolbar"><div class="summary" id="summary">Chargement…</div><button class="btn primary" id="addTableBtn">＋ Ajouter une table</button></div>
<div class="grid" id="tables"><div class="loading">Chargement des données…</div></div>
</div>

<div class="modal-wrap" id="modalWrap"><div class="modal">
<h2 id="modalTitle">Ajouter une table</h2>
<form id="tableForm"><div class="form-grid">
<div class="field full"><label>Nom de la table (automatique)</label><div class="name-preview" id="tableNamePreview">Table 1</div></div>
<div class="field"><label>Jeu</label><input id="game" placeholder="40k"></div>
<div class="field"><label>Décors</label><input id="terrain" placeholder=""></div>
<div class="field"><label>Joueur 1</label><input id="p1"></div><div class="field"><label>Joueur 2</label><input id="p2"></div>
<div class="field"><label>Joueur 3</label><input id="p3"></div><div class="field"><label>Joueur 4</label><input id="p4"></div>
</div><div class="modal-actions"><button type="button" class="btn" id="cancelBtn">Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>
</div></div>

<script>
// ============================================================
// CONFIGURATION SUPABASE
// ============================================================
const SUPABASE_URL = "https://syuaapflawgugaroyifl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_dotnNWbuJlVYrwF7MwZTpQ_f8Jy7aq7";

const configured = !SUPABASE_URL.includes("TON_URL") && !SUPABASE_ANON_KEY.includes("TA_CLE");
const supabaseClient = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let dates=[], currentDateId=null, editId=null, currentTables=[], computedTableName="";
const MAX_DATES = 10;
const SYNC_INTERVAL_MS = 30*60*1000;
const NOTE_DEBOUNCE_MS = 800;

const datesEl=document.getElementById("dates"), tablesEl=document.getElementById("tables"), summaryEl=document.getElementById("summary"), notice=document.getElementById("notice"), modalWrap=document.getElementById("modalWrap");
const noteInput=document.getElementById("dateNote"), noteStatus=document.getElementById("noteStatus");
let noteTimer=null, lastSavedNote="";

function showNotice(msg){notice.textContent=msg;notice.classList.add("show");}
function clearNotice(){notice.classList.remove("show");}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}

function pad2(n){return String(n).padStart(2,"0");}
function toISO(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;}
function toLabel(d){return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`;}

function getNextSaturdays(count){
 const list=[];
 const d=new Date(); d.setHours(0,0,0,0);
 while(d.getDay()!==6) d.setDate(d.getDate()+1);
 for(let i=0;i<count;i++){
  list.push(new Date(d));
  d.setDate(d.getDate()+7);
 }
 return list;
}

async function syncSaturdays(){
 if(!configured) return;

 const wanted = getNextSaturdays(MAX_DATES);
 const wantedSet = new Set(wanted.map(toISO));

 const {data:existing, error} = await supabaseClient
  .from("warhammer_dates")
  .select("id,date_value");

 if(error){ showNotice("Erreur Supabase : " + error.message); return; }

 const rows = existing || [];
 const existingSet = new Set(rows.map(r=>r.date_value));

 const toInsert = wanted
  .filter(d=>!existingSet.has(toISO(d)))
  .map(d=>({ date_value: toISO(d), label: toLabel(d), note: "" }));

 const toDelete = rows.filter(r=>!wantedSet.has(r.date_value)).map(r=>r.id);

 if(toInsert.length){
  const {error:insErr} = await supabaseClient.from("warhammer_dates").insert(toInsert);
  if(insErr){ showNotice("Création des samedis impossible : " + insErr.message); return; }
 }

 if(toDelete.length){
  const {error:delErr} = await supabaseClient.from("warhammer_dates").delete().in("id", toDelete);
  if(delErr){ showNotice("Suppression des dates obsolètes impossible : " + delErr.message); return; }
  if(toDelete.includes(currentDateId)) currentDateId = null;
 }
}

async function loadDates(){
 if(!configured){
  showNotice("Supabase n'est pas encore configuré.");
  dates=[];renderDates();renderTables();return;
 }
 clearNotice();

 await syncSaturdays();

 const {data,error}=await supabaseClient.from("warhammer_dates").select("*").order("date_value",{ascending:true});
 if(error){showNotice("Erreur Supabase : "+error.message);return;}
 dates=data||[];
 if(!currentDateId && dates.length) currentDateId=dates[0].id;
 if(currentDateId && !dates.some(d=>d.id===currentDateId)) currentDateId=dates[0]?.id||null;
 renderDates(); await loadTables();
}

async function loadTables(){
 if(!currentDateId){currentTables=[];renderTables();return;}
 const {data,error}=await supabaseClient.from("warhammer_tables").select("*").eq("date_id",currentDateId).order("table_number",{ascending:true});
 if(error){showNotice("Erreur lors du chargement des tables : "+error.message);return;}
 currentTables=data||[];renderTables();
}

function renderDates(){
 datesEl.innerHTML="";
 dates.forEach(d=>{
  const b=document.createElement("button");
  b.className="date-tab"+(d.id===currentDateId?" active":"");
  b.textContent=d.label;
  b.onclick=async()=>{currentDateId=d.id;renderDates();await loadTables();};
  datesEl.appendChild(b);
 });
 updateNoteField();
}

function renderTables(){
 const occupied=currentTables.reduce((n,t)=>n+[t.player1,t.player2,t.player3,t.player4].filter(Boolean).length,0);
 summaryEl.textContent=currentDateId?`${currentTables.length} table${currentTables.length>1?"s":""} · ${occupied} joueur${occupied>1?"s":""}`:"Aucune date disponible";
 if(!currentTables.length){tablesEl.innerHTML='<div class="empty">Aucune partie prévue pour cette date.<br><br>Ajoute une table pour commencer.</div>';return;}
 tablesEl.innerHTML=currentTables.map(t=>`
<article class="table-card"><div class="card-head"><div class="table-name">${esc(t.name)}</div><div class="status">${[t.player1,t.player2,t.player3,t.player4].filter(Boolean).length} joueur(s)</div></div>
<div class="card-body"><div class="row"><div class="label">Jeu</div><div class="value">${esc(t.game)||"—"}</div></div><div class="row"><div class="label">Décors</div><div class="value">${esc(t.terrain)||"—"}</div></div>
<div class="players"><div class="player"><small>Joueur 1</small>${esc(t.player1)||"—"}</div><div class="player"><small>Joueur 2</small>${esc(t.player2)||"—"}</div><div class="player"><small>Joueur 3</small>${esc(t.player3)||"—"}</div><div class="player"><small>Joueur 4</small>${esc(t.player4)||"—"}</div></div>
<div class="actions"><button class="btn" onclick="editTable('${t.id}')">Modifier</button><button class="btn danger" onclick="deleteTable('${t.id}')">Supprimer</button></div></div></article>`).join("");
}

// ---------- Champ note libre par samedi ----------
function updateNoteField(){
 if(!currentDateId){
  noteInput.value="";
  noteInput.disabled=true;
  noteInput.placeholder="Aucune date sélectionnée";
  noteStatus.textContent="";
  lastSavedNote="";
  return;
 }
 const d=dates.find(x=>x.id===currentDateId);
 noteInput.disabled=false;
 noteInput.placeholder="Tournoi 2000 pts, initiation, thème...";
 noteInput.value=d?.note||"";
 lastSavedNote=noteInput.value;
 noteStatus.textContent="";
}

async function saveNote(){
 if(!configured || !currentDateId) return;
 const d=dates.find(x=>x.id===currentDateId);
 if(!d) return;
 const value=noteInput.value.trim();
 if(value===lastSavedNote){
  // Rien de neuf, on nettoie juste le statut
  if(noteStatus.textContent==="…") noteStatus.textContent="";
  return;
 }
 noteStatus.textContent="Enregistrement…";
 const {error}=await supabaseClient
  .from("warhammer_dates")
  .update({ note: value })
  .eq("id", currentDateId);
 if(error){
  noteStatus.textContent="Erreur";
  showNotice("Erreur note : "+error.message+" (colonne 'note' ajoutée dans warhammer_dates ?)");
  return;
 }
 d.note=value;
 lastSavedNote=value;
 noteStatus.textContent="Enregistré ✓";
 setTimeout(()=>{ if(noteStatus.textContent==="Enregistré ✓") noteStatus.textContent=""; },1500);
}

noteInput.addEventListener("input",()=>{
 noteStatus.textContent="…";
 clearTimeout(noteTimer);
 noteTimer=setTimeout(saveNote, NOTE_DEBOUNCE_MS);
});
noteInput.addEventListener("blur",()=>{
 clearTimeout(noteTimer);
 saveNote();
});

// ---------- Modale table ----------
function openModal(t=null){
 editId=t?.id||null;document.getElementById("modalTitle").textContent=t?"Modifier la table":"Ajouter une table";
 computedTableName = t ? t.name : `Table ${currentTables.length+1}`;
 document.getElementById("tableNamePreview").textContent = computedTableName;
 document.getElementById("game").value=t?.game||"40k";document.getElementById("terrain").value=t?.terrain||"";
 ["p1","p2","p3","p4"].forEach((id,i)=>document.getElementById(id).value=t?.[`player${i+1}`]||"");
 modalWrap.classList.add("open");setTimeout(()=>document.getElementById("game").focus(),50);
}
function closeModal(){modalWrap.classList.remove("open");}
window.editTable=id=>openModal(currentTables.find(t=>t.id===id));
window.deleteTable=async id=>{const t=currentTables.find(x=>x.id===id);if(!confirm(`Supprimer ${t?.name||"cette table"} ?`))return;const {error}=await supabaseClient.from("warhammer_tables").delete().eq("id",id);if(error)showNotice(error.message);else await loadTables();};

document.getElementById("tableForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!configured)return;
 const payload={date_id:currentDateId,name:computedTableName,game:document.getElementById("game").value.trim(),terrain:document.getElementById("terrain").value.trim(),
 player1:document.getElementById("p1").value.trim(),player2:document.getElementById("p2").value.trim(),player3:document.getElementById("p3").value.trim(),player4:document.getElementById("p4").value.trim()};
 let result=editId?await supabaseClient.from("warhammer_tables").update(payload).eq("id",editId):await supabaseClient.from("warhammer_tables").insert(payload);
 if(result.error)showNotice("Erreur : "+result.error.message);else{closeModal();await loadTables();}
});
document.getElementById("addTableBtn").onclick=()=>{if(!currentDateId){showNotice("Aucune date disponible pour le moment.");return;}openModal();};
document.getElementById("cancelBtn").onclick=closeModal;modalWrap.addEventListener("click",e=>{if(e.target===modalWrap)closeModal();});

// Resynchronisation périodique
setInterval(async ()=>{ if(!configured) return; await loadDates(); }, SYNC_INTERVAL_MS);

loadDates();
</script>
</body>
</html>
